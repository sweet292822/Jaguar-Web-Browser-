<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camera Bypass Browser</title>
    <style>
        body { font-family: -apple-system, sans-serif; background: #f4f5f7; padding: 40px 20px; text-align: center; margin: 0; }
        .card { background: #fff; max-width: 400px; margin: 40px auto; padding: 30px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h2 { color: #111; margin-top: 0; }
        p { color: #666; font-size: 14px; line-height: 1.4; }
        input { width: 100%; padding: 12px; font-size: 16px; border: 1px solid #ccc; border-radius: 8px; margin-bottom: 16px; box-sizing: border-box; }
        button { width: 100%; background: #038AFD; border: none; padding: 14px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; color: white; }
        button:active { background: #026dc2; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Bypass Camera Lock</h2>
        <p>Enter the URL of the site forcing your camera open to launch it through the clean proxy browser:</p>
        <input type="url" id="targetUrl" placeholder="https://example.com/upload" value="https://">
        <button onclick="launchSite()">Open Clean Browser</button>
    </div>

    <script>
        function launchSite() {
            let url = document.getElementById('targetUrl').value;
            if(url && url !== "https://") {
                window.location.href = "/proxy?url=" + encodeURIComponent(url);
            }
        }
    </script>
</body>
</html>
